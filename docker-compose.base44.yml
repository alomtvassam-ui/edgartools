services:
  docs:
    image: python:3.12-slim
    working_dir: /app
    volumes:
      - .:/app
    ports:
      - "3000:3000"
    environment:
      - EDGAR_IDENTITY=Dev Gunning developer-gunning@gmail.com
      - PYTHONUNBUFFERED=1
      - __VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS
    command:
      - sh
      - -ec
      - |
        pip install --no-cache-dir mkdocs mkdocs-material pymdown-extensions
        exec mkdocs serve --dev-addr 0.0.0.0:3000 --watch /app
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:3000')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: on-failure
